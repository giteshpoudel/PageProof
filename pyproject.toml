[project]
name = "pageproof"
version = "0.1.0"
description = "Question answering over scanned books, with answers you can check against the page."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pillow>=12.1",
    "pymupdf>=1.27",
    "pytesseract>=0.3.13",
    "rapidfuzz>=3.10",
    "typer>=0.15",
    "requests>=2.32",
    "beautifulsoup4>=4.15.0",
    "pyarrow>=26.0.0",
    "duckdb>=2.0.0",
    "numpy>=2.5.4",
    "lancedb>=0.40.0",
    "sentence-transformers>=5.7.0",
    "python-dotenv>=1.2.4",
    "openai>=1.60",
    "pydantic>=2.14.1",
]

[project.optional-dependencies]
# Unlimited-OCR through Transformers (versions pinned to the model's tested set)
vlm = [
    "torch==2.10.0",
    "torchvision==0.25.0",
    "transformers==4.57.1",
    "einops==0.8.2",
    "addict==2.4.0",
    "easydict==1.13",
    "matplotlib==3.10.8",
    "psutil==7.2.2",
]

# Client for the vLLM server on the rented GPU
gpu = ["openai>=1.60"]

[project.scripts]
pageproof = "pageproof.cli:app"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
